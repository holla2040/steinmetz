[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "steinmetz"
version = "0.1.0"
description = "Automation tools for Autodesk Fusion Electronics, driven over Fusion's local HTTP bridge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["requests", "numpy"]

[project.scripts]
steinmetz = "steinmetz_cli:main"

# Flat source layout: the modules live in src/ (steinmetz is only the project name)
# and import each other by bare name, so every module the CLI reaches is listed.
[tool.setuptools]
py-modules = ["bridge", "scr", "board", "placevec", "selection", "place",
              "screenshot", "steinmetz_cli"]

[tool.setuptools.package-dir]
"" = "src"
